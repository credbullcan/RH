function down(e){if(S==='title'||S==='win'||S==='lose'){const r0=cv.getBoundingClientRect(),y0=(e.clientY-r0.top)/r0.height*640;if(S!=='title'&&window.TelegramGameProxy&&y0>530&&y0<590){try{TelegramGameProxy.shareScore()}catch(x){}return}reset();return}
 if(S==='arrest'){meter=Math.min(100,meter+6.5);return}

addEventListener('pointerup',()=>{L=R=0});addEventListener('pointercancel',()=>{L=R=0});

 if(e.key===' '||e.key==='Enter'){if(S==='arrest')meter=Math.min(100,meter+6.5);else if(S==='title'||S==='win'||S==='lose')reset()}});
